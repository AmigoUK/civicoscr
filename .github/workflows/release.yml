name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to create and release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub release with extension ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version }}"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          gh release create "$TAG" dist/*.zip \
            --target "$GITHUB_SHA" \
            --title "Civico.net Downloader $TAG" \
            --notes-file .github/release-notes.md
